name: Build and Release MultiVirtDesk

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile MultiVirtDesk with csc.exe
      run: |
        .\build.bat

    - name: Package Release Zip
      run: |
        Compress-Archive -Path MultiVirtDesk.exe, MultiVirtDesk-cli.exe, install.bat, uninstall.bat, README.md, LICENSE -DestinationPath MultiVirtDesk.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MultiVirtDesk-binaries
        path: MultiVirtDesk.zip

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: MultiVirtDesk.zip
        generate_release_notes: true
